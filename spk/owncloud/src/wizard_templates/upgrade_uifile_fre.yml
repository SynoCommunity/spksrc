OWNCLOUD_INCOMPATIBLE_UPGRADE_STEP_TITLE: "Mise à jour incompatible"
OWNCLOUD_INCOMPATIBLE_UPGRADE_DESCRIPTION: "<strong>AVIS:</strong> La version ${OC_OLD_VER} de ownCloud ne peut pas être mise à jour vers la version ${OC_NEW_VER}. Veuillez désinstaller la version précédente et n'oubliez pas de sauvegarder le répertoire de données d'ownCloud avant de le faire."

OWNCLOUD_MIGRATE_DATABASE_STEP_TITLE: "Migrer la base de données vers MariaDB"
OWNCLOUD_MIGRATE_DATABASE_DESCRIPTION: "<strong>AVIS:</strong> le processus de mise à niveau ne prend en charge que les bases de données MariaDB (MySQL). Veuillez migrer votre base de données actuelle vers MariaDB avant de procéder à la mise à niveau, puis réessayez."
OWNCLOUD_MIGRATE_DATABASE_DETAILS: "Veuillez suivre les étapes manuelles fournies sur cette page Web: <a target=\\\"_blank\\\" href=\\\"https://docs.synocommunity.com/packages/owncloud/\\\">Migration de base de données ownCloud</a>."

OWNCLOUD_UPGRADE_LIMITATIONS_STEP_TITLE: "Limitations de la mise à niveau"
OWNCLOUD_UPGRADE_LIMITATIONS_DESCRIPTION: "Veuillez noter les limitations suivantes lors de la mise à jour du package ownCloud:"
OWNCLOUD_UPGRADE_LIMITATION_1_TEXT: "Si vous exécutez les tâches de fond d'ownCloud depuis une tâche cron système, désactivez-la avant la mise à niveau."
OWNCLOUD_UPGRADE_LIMITATION_2_TEXT: "Arrêtez Web Station (ou empêchez autrement l'accès via le navigateur) avant la mise à niveau. ownCloud est placé en mode maintenance pendant la mise à niveau."
OWNCLOUD_UPGRADE_LIMITATION_3_TEXT: "Vérifiez la compatibilité des applications tierces. Les applications non fournies avec ownCloud sont désactivées avant la mise à niveau et enregistrées ; réactivez celles qui sont compatibles ensuite avec 'occ app:enable &lt;app&gt;'."
