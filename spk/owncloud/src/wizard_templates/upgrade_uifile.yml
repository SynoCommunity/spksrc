OWNCLOUD_INCOMPATIBLE_UPGRADE_STEP_TITLE: "Incompatible upgrade"
OWNCLOUD_INCOMPATIBLE_UPGRADE_DESCRIPTION: "<strong>NOTICE:</strong> Version ${OC_OLD_VER} of ownCloud cannot be updated to version ${OC_NEW_VER}. Please uninstall the previous version and remember to save your ownCloud data directory before doing so."

OWNCLOUD_MIGRATE_DATABASE_STEP_TITLE: "Migrate database to MariaDB"
OWNCLOUD_MIGRATE_DATABASE_DESCRIPTION: "<strong>NOTICE:</strong> The upgrade process only supports MariaDB (MySQL) databases. Please migrate your current database to MariaDB before proceeding with the upgrade, and then try again."
OWNCLOUD_MIGRATE_DATABASE_DETAILS: "Please follow the manual steps provided on this webpage: <a target=\\\"_blank\\\" href=\\\"https://docs.synocommunity.com/packages/owncloud/\\\">ownCloud Database Migration</a>."

OWNCLOUD_UPGRADE_LIMITATIONS_STEP_TITLE: "Upgrade limitations"
OWNCLOUD_UPGRADE_LIMITATIONS_DESCRIPTION: "Please note the following limitations when upgrading the ownCloud package:"
OWNCLOUD_UPGRADE_LIMITATION_1_TEXT: "If you run ownCloud background jobs from a system cron job, disable it before upgrading."
OWNCLOUD_UPGRADE_LIMITATION_2_TEXT: "Stop Web Station (or otherwise prevent browser access) before upgrading. ownCloud is placed in maintenance mode during the upgrade."
OWNCLOUD_UPGRADE_LIMITATION_3_TEXT: "Review third-party apps for compatibility. Apps not shipped with ownCloud are disabled before the upgrade and recorded; re-enable compatible ones afterwards with 'occ app:enable &lt;app&gt;'."
