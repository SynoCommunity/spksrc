/*
 * Host definitions with object attributes
 * used for apply rules for Service, Notification,
 * Dependency and ScheduledDowntime objects.
 *
 * Tip: Use `icinga2 object list --type Host` to
 * list all host objects after running
 * configuration validation (`icinga2 daemon -C`).
 */

/*
 * This is an example host based on your
 * local host's FQDN. Specify the NodeName
 * constant in `constants.conf` or use your
 * own description, e.g. "db-host-1".
 */

object Host NodeName {
  /* Import the default host template defined in `templates.conf`. */
  import "generic-host"

  /* Specify the address attributes for checks e.g. `ssh` or `http`. */
  address = "127.0.0.1"
  address6 = "::1"

  /* Set custom variable `os` for hostgroup assignment in `groups.conf`. */
  vars.os = "Linux"

  /* Define http vhost attributes for service apply rules in `services.conf`. */
  vars.http_vhosts["http"] = {
    http_uri = "/"
    /* Send Host header so the default nginx vhost accepts the request */
    http_vhost = "127.0.0.1"
  }

  /* Define disks and attributes for service apply rules in `services.conf`. */
  vars.disks["disk"] = {
    /* Skip Synology's internal Docker storage (not accessible to the service user) */
    disk_partitions_excluded = "/volume1/@docker/btrfs"
  }
  vars.disks["disk /"] = {
    disk_partitions = "/"
  }

  /* Mail notifications disabled by default on Synology DSM.
   * Uncomment and configure if you have a mail utility installed.
   */
  //vars.notification["mail"] = {
  //  groups = [ "icingaadmins" ]
  //}
}
